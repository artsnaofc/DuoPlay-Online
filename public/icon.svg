<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="p1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="p2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#1e293b" stroke-width="4" stroke-opacity="0.8" />

  <!-- Center DuoPlay Glyph: Stylized Connected Controllers / "D" and "P" Nodes -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Player 1 Arc (Left - Blue/Cyan) -->
    <path d="M -40,-90 C -120,-90 -160,-30 -160,30 C -160,90 -110,120 -60,95 L -35,80 C -25,75 -15,85 -15,95 L -15,115 C -15,130 -35,140 -50,140"
          fill="none" stroke="url(#p1)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Player 2 Arc (Right - Purple/Pink) -->
    <path d="M 40,90 C 120,90 160,30 160,-30 C 160,-90 110,-120 60,-95 L 35,-80 C 25,-75 15,-85 15,-95 L 15,-115 C 15,-130 35,-140 50,-140"
          fill="none" stroke="url(#p2)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- D-Pad Left -->
    <circle cx="-95" cy="0" r="14" fill="#38bdf8" />
    <path d="M -95,-22 L -95,22 M -117,0 L -73,0" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />

    <!-- Action Buttons Right -->
    <circle cx="95" cy="-14" r="8" fill="#ec4899" />
    <circle cx="115" cy="6" r="8" fill="#a855f7" />
    <circle cx="75" cy="6" r="8" fill="#38bdf8" />
    <circle cx="95" cy="26" r="8" fill="#10b981" />

    <!-- Central Synced Nexus -->
    <circle cx="0" cy="0" r="12" fill="#f8fafc" />
    <circle cx="0" cy="0" r="24" fill="none" stroke="#f8fafc" stroke-width="3" stroke-dasharray="6 6" opacity="0.6" />
  </g>
</svg>
